# ─────────────────────────────────────────────────────────────────────────────
# Compose file for the trading-automation Spring Boot service.
#
#   Start:   docker compose up -d --build
#   Logs:    docker compose logs -f
#   Stop:    docker compose down
#
# Secrets (Webull keys, Telegram tokens) are read from the local .env file via
# env_file — copy .env.example to .env and fill it in first. The .env file is
# gitignored and is NOT baked into the image.
# ─────────────────────────────────────────────────────────────────────────────
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradingautomation:latest
    container_name: tradingautomation
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      # /api/health is a dependency-free liveness probe that returns 200 when up.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
