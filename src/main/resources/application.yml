spring:
  # Paper vs live is controlled by app.engine.mode below — NOT by a profile.
  # Spring Boot DevTools — auto-restart on classpath changes during development.
  devtools:
    restart:
      enabled: true
      # Don't trigger a restart when only the watchlist file changes — reload it manually instead.
      exclude: "tickers.txt"
    livereload:
      enabled: true

# ── Logging ──────────────────────────────────────────────────────────────
# To see the Webull request/response logs you need BOTH:
#   1. broker.webull.api.log-requests: true   (below)
#   2. this logger at DEBUG                    (uncomment the line below)
logging:
  level:
    com.trading.webull.WebullV3Client: INFO   # set to DEBUG to emit request/response logs; also set broker.webull.api.log-requests: true
    # DEBUG here logs WHY a strategy skipped a ticker each bar (no fresh cross, not above
    # EMAs, not a strong green candle, ST not UP, cooldown, etc.). Noisy but essential for
    # answering "why didn't it take the trade?". Set back to INFO to quiet it.
    com.trading.strategy: DEBUG
  # Write logs to a rolling file (in addition to the console).
  file:
    name: logs/tradingautomation.log
  logback:
    rollingpolicy:
      # Roll when the file hits the size cap or at day change; keep a bounded history.
      file-name-pattern: logs/tradingautomation-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 14          # keep 14 days of rolled logs
      total-size-cap: 500MB    # hard cap on total log disk usage

# ── Broker (broker-specific config: credentials, endpoint paths, routing) ──
broker:
  # Selects the active broker adapter. "webull" wires the Webull v3 adapter.
  provider: webull
  webull:
    api:
      app-key: ${WEBULL_APP_KEY}
      app-secret: ${WEBULL_APP_SECRET}
      region-id: "us"
      # Leave blank to use automatic endpoint based on app.engine.mode:
      #   PAPER → api.sandbox.webull.com   |   LIVE → api.webull.com
      endpoint: ""
      # Optional 2FA access token (x-access-token). Leave blank when 2FA is off.
      access-token: ${WEBULL_ACCESS_TOKEN:}
      # Explicit account ID to trade against. Leave blank to auto-pick the MARGIN
      # equity account from GET /trading/accounts/list (INDIVIDUAL_MARGIN). Set an
      # override here (or via WEBULL_ACCOUNT_ID env var) only if you need a specific
      # account and don't want auto-selection.
      account-id: ${WEBULL_ACCOUNT_ID:}
      # Log the full request/response to the Webull API (method, path, masked
      # headers, body). Emitted at DEBUG level — you must ALSO set the logging
      # level below to DEBUG for the lines to appear. Off by default.
      log-requests: false

    # ── Webull v3 endpoint paths ───────────────────────────────────────────
    # Override any path here if Webull changes a route — no recompile needed.
    endpoints:
      account-list: "/trading/accounts/list"
      account-balance: "/trading/assets/balances/get"
      positions: "/trading/assets/positions/list"
      place-order: "/trading/orders/place"
      order-history: "/trading/orders/historical-orders/list"
      open-orders: "/trading/orders/open-orders/list"
      bars: "/market-data/stocks/bars/list"
      snapshot: "/market-data/stocks/snapshots/list"

# ── App (broker-neutral domain config) ─────────────────────────────────────
app:
  engine:
    # ── THE ONLY SWITCH between paper and live trading ────────────────────
    #   PAPER = Webull SANDBOX endpoint (api.sandbox.webull.com) — no real money
    #   LIVE  = PRODUCTION endpoint (api.webull.com) — REAL orders, real money
    # Orders are always submitted to the endpoint the mode selects.
    mode: LIVE
    # Master switch for AUTOMATED trading. false = full stop (no strategy entries,
    # no automatic exits) — but REST endpoints and MANUAL trades still work.
    trading-enabled: false
    ticker: AAPL                              # fallback when tickers.txt is absent
    watchlist-path: "classpath:tickers.txt"
    warmup-bars: 700
    ema-period: 600
    # ── Position sizing ──────────────────────────────────────────────────
    #   SHARES  = buy exactly order-quantity shares (if buying power covers it).
    #   PERCENT = buy floor(order-buying-power-pct * buyingPower / price) shares;
    #             order-quantity is ignored. Skips if it resolves to < 1 share or
    #             buying power is below risk.min-buying-power-usd.
    sizing-mode: "PERCENT"
    order-quantity: 5                 # used only when sizing-mode: SHARES
    order-buying-power-pct: 0.30      # used only when sizing-mode: PERCENT (40%)
    # EMA periods returned by the GET /api/ema/{ticker} endpoint
    ema-periods: [8, 20, 50, 100, 200, 600]
    # Trading sessions included in bar/market-data requests (comma-separated, multiple allowed):
    #   RTH = regular hours (09:30–16:00 ET), PRE = pre-market, ATH = after-hours, OVN = overnight
    # Endpoints accept a `sessions` query param to override this default per-request.
    trading-sessions: "RTH,PRE,ATH"
    # Max tickers processed in parallel per tick (guard sweep + candle dispatch).
    # Bounds concurrent Webull calls. 1 = sequential. Lowered to reduce 429s.
    ticker-concurrency: 3
    # Client-side cap on Webull bar-fetch requests/second (all threads) to avoid
    # 429 TOO_MANY_REQUESTS. Webull's Data API limit is 300/60s (=5/s), so keep
    # this BELOW 5 for headroom (retries, order + snapshot calls also count). 0 = unlimited.
    max-requests-per-second: 4
    # Max bid/ask spread as a FRACTION of the mid price (scales across price levels).
    # (ask-bid)/mid must be <= this or no trade is placed in any session (buy or exit).
    # 0.003 = 0.30% of price. Also blocks when bid/ask are unavailable. 0 = disable width check.
    max-spread-pct: 0.003


  # ── Strategy enable / disable ────────────────────────────────────────────
  strategies:
    ema600-enabled: false            # disabled — running the ST+cross strategy instead
    ema-crossover-enabled: false     # disabled — running the ST+cross strategy instead
    # "1m Supertrend + 20/50 Cross" strategy (standalone; BYPASSES the universal entry
    # guard). Entry on st-cross-timeframe: ST UP + fresh 20/50 cross + price above
    # 20/100/200 EMA + price within st-cross-ema600-band of the 600-EMA. Exit is the
    # ST_CROSS exit manager below (single 50-EMA trail). Set exit.manager: ST_CROSS.
    st-cross-enabled: true
    st-cross-timeframe: "M1"
    st-cross-ema-cross-fast: 20
    st-cross-ema-cross-slow: 50
    # false = STATE: enter whenever EMA20 > EMA50 (trend already up) — catches trends
    #         in progress, not just the crossover bar.
    # true  = FRESH CROSS: only the exact bar where 20 crosses above 50.
    st-cross-require-fresh-cross: false
    st-cross-ema600-band: 1.0       # 1.0 = effectively "buy anywhere" (100% band, always passes)
    # Shared "strong green candle" gate used by ALL strategies (CandleStrength):
    # the signal bar must be green and its body >= this fraction of its high-low range.
    body-min-ratio: 0.5
    # Shared "don't buy the high" filter used by ALL strategies (EntryPriceFilter):
    # block a BUY when price is extended more than max-extension above the ref EMA.
    no-buy-high-enabled: true
    no-buy-high-ref-ema: 200
    no-buy-high-max-extension: 0.002  # block if price > ema200 * (1 + 0.2%)
    # Shared "never buy below an EMA floor" filter (EntryPriceFilter): block a BUY
    # when price is at/below this EMA. With the ceiling above, entries are confined to
    # a band — above the 50-EMA floor, within 0.2% above the 200-EMA.
    no-buy-below-enabled: true
    no-buy-below-ref-ema: 50
    # Bar timeframe each strategy evaluates its ENTRY on (M1/M5/M15/M30/...).
    # Strategies are entry-only; exits are handled by the universal exit rule below.
    ema600-timeframe: "M1"
    ema-crossover-timeframe: "M1"
    # Volume filter (all strategy BUYs): only enter when average 1-min volume is
    # rising — over the last `volume-lookback` completed bars, the recent-half average
    # volume must exceed the older-half average (e.g. last 10 vs prior 10).
    volume-filter-enabled: false
    volume-lookback: 20
    # If a signal fires but volume isn't rising yet, hold it this many minutes and
    # re-check volume each bar; buy if it turns rising, else drop. 0 = no hold.
    volume-hold-minutes: 5
    # Cooldown: once a ticker is bought or exited, don't trade it again for this
    # many minutes (prevents immediate re-entry / churn). 0 = disabled.
    re-trade-cooldown-minutes: 10
    # 600-EMA entry = a bullish candle NEAR the 600-EMA (either side) closing above
    # it, on the latest completed bar. Captures a bounce OR an open-on-EMA momentum
    # candle, while rejecting bars floating far above the EMA (chasing highs).
    ema600-proximity-band: 0.005          # low must be within 0.5% of the EMA
    ema600-require-wick-rejection: false  # true = also require low < EMA
    # (body strength now uses the shared strategies.body-min-ratio above)

  # ── Universal EXIT rule (all bot-opened positions; independent of entry) ──
  # Staged TRAILING stop — cut losers small, let winners run the trend. The stop
  # only ever ratchets UP; sell at market once price falls to/through it. Stages
  # (checked on the exit timeframe, latest COMPLETED bar):
  #   1. Hard stop      — entry * (1 - stop-loss-pct). Worst-case backstop.
  #   2. Breakeven      — at +breakeven-trigger-pct, move stop to entry + buffer.
  #   3. Structure trail— at +trail-arm-pct, trail the PREVIOUS candle's low,
  #                       ratcheting up as the trend prints higher lows.
  # Plus an EMA-bearish STATE exit (ema-fast below ema-slow) as a trend-failure catch.
  exit:
    enabled: true
    stop-loss-pct: 0.02        # -2% hard stop from entry (real, bounded backstop)
    ema-fast: 20
    ema-slow: 50
    timeframe: "M5"            # exit checks run on M5 (slower than entry; less noise)
    # Breakeven stop: once price is >= this % above entry, move the stop up to
    # entry + buffer (buffer = current bid/ask spread, min breakeven-min-buffer-usd)
    # so the trade can no longer turn into a loss.
    breakeven-trigger-pct: 0.01      # +1.0%
    breakeven-min-buffer-usd: 0.02
    # Structure trail: once price is >= this % above entry, trail the stop at the
    # previous completed candle's low (only moves up). Lets a winner run until the
    # trend breaks structure. Keep >= breakeven-trigger-pct.
    trail-arm-pct: 0.01              # +1.0%
    # ── Which exit manager is ACTIVE (exactly one runs) ──────────────────────
    #   STAGED   = the staged trailing stop above (hard stop + breakeven + M5 trail).
    #   ST_CROSS = 50-EMA trail for the "1m ST + 20/50 Cross" strategy: sell when
    #              price <= ema50 * (1 - ema50-trail-pct) (ratchets up only), OR when
    #              price <= entry * (1 - stop-loss-pct) hard stop (bounded backstop).
    #              Whichever hits first.
    manager: "ST_CROSS"
    ema50-trail-timeframe: "M1"      # timeframe for the ST_CROSS 50-EMA
    ema50-trail-pct: 0.0005          # exit at ema50 - 0.05%

  # ── Diagnostics (local debugging only) ────────────────────────────────────
  diagnostics:
    # Exposes GET /api/diagnostics/credentials showing the loaded app key (full)
    # and app secret (MASKED + SHA-256 fingerprint). Off by default.
    # NEVER enable this in a shared or production environment.
    # Read via @Value("${app.diagnostics.credentials-endpoint-enabled}").
    credentials-endpoint-enabled: true

  # ── Risk management ───────────────────────────────────────────────────────
  risk:
    # Halt trading for the rest of the day once losses exceed this % of
    # start-of-day equity.  0.10 = 10 %.
    max-daily-drawdown-pct: 0.20
    # Refuse new BUY orders when available buying power is below this amount ($).
    min-buying-power-usd: 100.0
    # Fetch a fresh account snapshot after every order.
    account-refresh-enabled: true
    # Daily drawdown halt. false = never auto-halt on drawdown (max-daily-drawdown-pct
    # is ignored while disabled). The $100 buying-power floor still applies.
    drawdown-halt-enabled: false

  # ── Supertrend indicator params (used app-wide via SupertrendService) ─────
  supertrend:
    length: 7
    factor: 2

  # ── ADX / Directional-Movement params (used app-wide via AdxService) ──────
  # +DI / −DI give direction; ADX gives trend strength. `threshold` separates a
  # real trend (>=) from weak/ranging (<); `rising` is how many bars back ADX is
  # compared against to judge "rising" for the LOW_ADX_RISING pattern.
  # The GET /api/adx/{ticker} inspection endpoint can override any of these per
  # request via ?period= / ?threshold= / ?rising= query params.
  adx:
    period: 14
    threshold: 25
    rising: 3

  # ── Notifications (push trade alerts to your phone) ───────────────────────
  # Telegram: create a bot via @BotFather for the token, and get your chat id
  # (e.g. message @userinfobot). Failures never affect trading.
  # Telegram DELIVERY channel only. WHAT gets sent is driven by app.alerts below
  # (and the /api/notifications/test endpoint). For a channel, set the chat id to
  # @channelname (public) or a -100... id (private) and make the bot a channel admin.
  notifications:
    enabled: true                    # turn on when token + chat id are set
    channel: "TELEGRAM"
    telegram-bot-token: "${TELEGRAM_BOT_TOKEN:}"
    telegram-chat-id: "${TELEGRAM_CHAT_ID:}"
    # Native macOS desktop banner on EVERY fired alert (in ADDITION to Telegram). Master
    # toggle for the feature — flip to false to switch it off. No-op on non-mac/headless.
    desktop-enabled: true
    desktop-sound: "Ping"            # macOS sound name (Ping/Glass/Hero/...); blank = silent
    # Multiple alerts in one tick coalesce into ONE banner, each alert on its own line.

  # ── Market alerts (pluggable; posted to the notification channel) ─────────
  # One scheduler ticks every minute; each ENABLED alert runs on its OWN scan-minutes
  # cadence over universe.txt, reusing the shared market-data cache (no separate fetch).
  # Each alert has its own message-prefix. Deduped (posted only when state changes).
  alerts:
    enabled: true
    # ST+ADX changes at most per M5 bar → scan every 5 min. BULLISH when Supertrend is UP
    # and ADX recommends BUY; BEARISH when Supertrend is DOWN and ADX recommends SELL.
    st-adx:
      enabled: false
      # Supertrend must agree on ALL these timeframes (comma-separated). The FIRST is the
      # primary — ADX + price come from it. "M5" = single tf; "M5,M15" also requires M15 ST.
      supertrend-timeframes: "M5,M15"
      scan-minutes: 5
      message-prefix: "5MIN TREND - "
      # Optional price-vs-EMA gate: BULLISH also needs price ABOVE ema-period on
      # ema-timeframe, BEARISH below. Independent of the ST timeframes (e.g. 600-EMA/M1).
      ema-enabled: true
      ema-period: 600
      ema-timeframe: "M1"
      # This alert's OWN Telegram channel. There is no common channel — blank means this
      # alert has nowhere to post and is skipped. @name (public) or -100... (private, bot admin).
      telegram-chat-id: "${TELEGRAM_STADX_CHAT_ID:}"
    # Opening-Range Breakout — all under alerts.orb. Opening range = high/low of today's
    # 09:30 ET candle on the range-minutes timeframe (15 -> M15 = 9:30–9:45, 30 -> M30 =
    # 9:30–10:00). Fetched once/day, cached (works on late start). The break is a CLOSE on
    # each direction's scan-minutes timeframe beyond the range, with an OPTIONAL EMA-slope
    # and Supertrend-slope confluence.
    # NOTE: range-minutes and scan-minutes MUST be Webull timeframes: 1/5/15/30/60.
    orb:
      range-minutes: 15
      # Require the breakout candle's color to match the direction: UP break must be a GREEN
      # candle (close > open), DOWN break must be RED (close < open). Doji = rejected. true = on.
      require-breakout-candle-color: true
      ema-period: 600
      ema-slope-lookback: 3
      ema-slope-enabled: false      # false = fire on a pure break, no EMA-slope confirmation
      # Default Telegram channel for BOTH ORB directions. A direction's own telegram-chat-id
      # (under up:/down:) overrides this. Blank here AND there = that direction is skipped
      # (there is no common channel). Set the same id for both to share one channel, or
      # different ids per direction to split them.
      telegram-chat-id: "${TELEGRAM_ORB_CHAT_ID:}"
      # Supertrend-line-slope confluence (optional). When enabled, an UP break fires only if the
      # Supertrend LINE has been advancing UP on ANY of the last st-slope-bars bars (DOWN mirrors)
      # — so a currently-flat line still passes if it moved in-direction recently. Uses the shared
      # app.supertrend length/factor (control those there). The timeframe is INDEPENDENT of the
      # ORB range/scan timeframes (any M1/M5/M15/... or synthetic M2/M3).
      st-slope-confirm-enabled: true
      st-slope-timeframe: "M5"      # Supertrend timeframe for this gate (independent of ORB)
      st-slope-lookback: 2         # bars spanned by ONE slope measurement (same as swift)
      st-slope-min-atr: 0.1         # required line advance over the lookback, in ATR units
      st-slope-bars: 3              # pass if ANY of the last N bars meets the slope threshold
      up:
        enabled: true
        scan-minutes: 2        # break + EMA on M5 (poll every 5 min)
        message-prefix: "ORB UP - "
        # Optional: own channel for UP breaks. Blank → inherits orb.telegram-chat-id above.
        telegram-chat-id: "${TELEGRAM_ORB_UP_CHAT_ID:}"
      down:
        enabled: true
        scan-minutes: 2
        message-prefix: "ORB DOWN - "
        # Optional: own channel for DOWN breaks. Blank → inherits orb.telegram-chat-id above.
        telegram-chat-id: "${TELEGRAM_ORB_DOWN_CHAT_ID:}"

    # Swift Trend Scanner — a FRESH Supertrend direction flip backed by strong,
    # ATR-normalised momentum (pure Supertrend + momentum, no EMA). Swift UP = a recent
    # flip to UP that immediately runs away from the Supertrend line; swift DOWN mirrors.
    # Slow grinds that hug the line, choppy whipsaws, and exhausted/extended moves are all
    # filtered out. Fires ONCE per flip per symbol, then a cooldown. Each signal is posted
    # as its OWN message to a SEPARATE Telegram channel (telegram-chat-id below), reusing
    # the shared bot token (app.notifications.telegram-bot-token). Runs on the shared
    # AlertEngine tick, so it only fires within configured market hours.
    # Message: "<prefix><DIR-emoji> <SYMBOL> <DIRECTION> @ <price>".
    # All *-atr thresholds are in ATR units (price-agnostic). timeframe is configurable.
    swift-scan:
      enabled: true
      timeframe: "M2"                # Supertrend + candle timeframe (M1/M5/M15/M30/M60)
      scan-minutes: 1                # poll cadence (every minute by default)
      message-prefix: "SWIFT TREND - "
      cooldown-minutes: 30           # per symbol+direction, suppress repeats for 30 min
      # SEPARATE channel for swift alerts. @channelname (public) or -100... (private, bot
      # must be admin). Defaults to the swift channel; override via TELEGRAM_SWIFT_CHAT_ID.
      telegram-chat-id: "${TELEGRAM_SWIFT_CHAT_ID}"
      # ── Momentum thresholds (ATR-normalised) ──
      min-travel-atr: 1.5            # price must travel >= 1.5x ATR since the flip
      min-separation-atr: 1          # |close-supertrend|/ATR now — a FLOOR only (NOT required
                                     # to widen every bar; stair-step trends dip and recover)
      strong-candle-window: 5        # inspect the last 5 candles for strength
      min-strong-candles: 2          # >=N of them must be strong directional bodies. Kept
                                     # low: travel + separation already prove the move; real
                                     # intraday cascades are stair-steps of modest candles,
                                     # not 3+ monster bodies. Raise to tighten.
      body-min-atr: 0.5              # a "strong" candle body is >= 0.5x ATR
      flip-window-bars: 5            # whipsaw guard window
      max-flips-in-window: 2         # >=2 flips in that window => choppy, reject
      # Supertrend LINE slope: the line itself must be advancing in the trend direction
      # (rising in an UP leg / falling in a DOWN leg), not shelved flat. Measured over
      # st-slope-lookback bars; min-st-slope-atr is the required advance in ATR units.
      st-slope-lookback: 2           # bars back to measure the ST line's own movement
      min-st-slope-atr: 0.1          # ST must advance >= 0.1x ATR over the lookback (0 = only reject wrong-way)
      # Climax/spike cap: reject the signal when the signal bar's range (high-low) is
      # abnormally large (a blow-off bar that already made the move). Lower = stricter
      # (filters more big candles). 0 or less disables the cap.
      max-candle-atr: 3.0            # reject if signal bar range > 3x ATR

  # ── Entry guard (applies to EVERY BUY across all strategies) ──────────────
  # Two legs, checked on the latest COMPLETED bar:
  #   1. Supertrend is UP on `supertrend-timespan` (uses app.supertrend params)
  #   2. EMA stack on `ema-timespan`: EMA(fast) > EMA(slow), and (if ema-require-mid)
  #      also EMA(mid) > EMA(slow).
  # `condition-logic` combines the legs:
  #   AND (default) = both must pass — strict, fewest but highest-quality arms.
  #   OR            = arm once EITHER leg passes — looser, more arms. Under OR an
  #                   unavailable leg just counts as "not passed"; the other can arm.
  # Loosening levers (default = strict): drop the mid leg (ema-require-mid: false),
  # use a faster ST timeframe (supertrend-timespan: M15), or switch to OR.
  # Applies to ALL strategies uniformly (no per-strategy bypass). When disabled, the
  # orchestrator dispatches the full watchlist every minute (no arming), so 1-minute
  # strategies run at true 1-minute cadence.
  entry-guard:
    enabled: false                   # OFF — the active ST+cross strategy carries its own trend logic
    ema-fast: 100
    ema-mid: 200
    ema-slow: 600
    ema-timespan: "M1"
    supertrend-timespan: "M15"      # M15 arms sooner / more often (more whipsaw). Webull has no M10.
    ema-require-mid: false           # false = only require EMA(fast) > EMA(slow)
    condition-logic: "OR"          # AND = both legs; OR = either leg arms

  # ── Market hours (America/New_York) ──────────────────────────────────────
  market-hours:
    core-open: "09:30"
    core-close: "16:00"
    # Extended hours ON so the pre-market (07:30–09:30) is a valid ENTRY window.
    # after-hours-close = 16:00 makes the after-hours window empty, so entries
    # run 07:30–16:00 ET (late pre-market + regular), stopping at 4 PM.
    extended-hours-enabled: true
    pre-market-open: "09:00"
    after-hours-close: "15:30"

  # ── Local-LLM advisory analyst (broker-neutral) ──────────────────────────
  # An OPTIONAL reasoning layer on top of the deterministic indicators/alerts. It
  # turns a signal "briefing" into a conviction score + action recommendation; it
  # NEVER computes indicators and NEVER places orders — the risk/exit layer keeps
  # final authority and can override it. If the LLM is off, down, slow, or returns
  # garbage, callers fail safe to a neutral WAIT (trading is never affected).
  #
  # Targets a local Ollama server by default. Swapping runtime/model is config-only:
  #   ollama serve           # starts the runtime on localhost:11434
  #   ollama pull qwen3:8b   # the default model
  # Inspect it (no trading wiring) via:
  #   GET /api/llm/analyze/{ticker}?fact=...&fact=...
  llm:
    enabled: true                   # opt-in; set false to disable the whole layer
    base-url: "http://localhost:11434"
    model: "qwen3:8b"               # fast decision-maker. Use qwen3:14b for deeper review.
    generate-path: "/api/generate"
    temperature: 0.2                # low = disciplined/deterministic
    think: false                    # true = slower, step-by-step reasoning (EOD review)
    timeout-seconds: 20             # on timeout, caller fails safe to WAIT
    max-conviction: 10

  # ── Parallel LLM alert review (broker-neutral) ───────────────────────────
  # When an alert fires, a SEPARATE async pipeline gathers a multi-timeframe
  # distilled snapshot of the symbol (bars + Supertrend + EMA stack per TF) and
  # asks the LLM to measure conviction + confidence in the ALERT's direction,
  # with reasoning and next-direction scenarios. Results are logged (structured
  # line + JSON sidecar) for end-of-day analysis.
  #
  # Runs AFTER the alert is delivered, on its own executor — never slows or blocks
  # alert delivery, and any failure is swallowed (the alert path is unaffected).
  #
  # DAY-TRADING scope: M15 / M5 (primary) / M1, with bar counts big enough that
  # Supertrend AND ADX actually compute on each. A compact daily-bias line (prior
  # close vs today's open) gives higher-TF context. Each TF is DISTILLED to one line
  # (ST + ADX + volume trend + fast EMAs + position in the day's range) — never raw
  # bars — so the briefing stays small. Bars read via BarDataManager (configured sessions).
  alert-review:
    enabled: true                   # opt-in; set false to disable the whole pipeline
    model: "qwen3:14b"              # deeper model — off the critical path, latency OK.
                                    #   blank → fall back to app.llm.model (qwen3:8b)
    m15-bars: 80                    # swing/structure context
    m5-bars: 120                    # the primary day-trade timeframe
    m1-bars: 200                    # entry timing / today's session
    ema-periods: [9, 20, 50]        # fast, day-trade EMA set
    pool-size: 2                    # async review workers
    log-json: true                  # also write a per-review JSON sidecar
    json-dir: "logs/alert-reviews"
