spring:
  # Paper vs live is controlled by webull.trading.mode below — NOT by a profile.
  # Spring Boot DevTools — auto-restart on classpath changes during development.
  devtools:
    restart:
      enabled: true
      # Don't trigger a restart when only the watchlist file changes — reload it manually instead.
      exclude: "tickers.txt"
    livereload:
      enabled: true

# ── Logging ──────────────────────────────────────────────────────────────
# To see the Webull request/response logs you need BOTH:
#   1. webull.api.log-requests: true   (below)
#   2. this logger at DEBUG            (uncomment the line below)
logging:
  level:
    com.trading.webull.WebullV3Client: INFO   # set to DEBUG to emit request/response logs
  # Write logs to a rolling file (in addition to the console).
  file:
    name: logs/tradingautomation.log
  logback:
    rollingpolicy:
      # Roll when the file hits the size cap or at day change; keep a bounded history.
      file-name-pattern: logs/tradingautomation-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 14          # keep 14 days of rolled logs
      total-size-cap: 500MB    # hard cap on total log disk usage

webull:
  api:
    app-key: ${WEBULL_APP_KEY}
    app-secret: ${WEBULL_APP_SECRET}
    region-id: "us"
    # Leave blank to use automatic endpoint based on trading.mode:
    #   PAPER → api.sandbox.webull.com   |   LIVE → api.webull.com
    endpoint: ""
    # Optional 2FA access token (x-access-token). Leave blank when 2FA is off.
    access-token: ${WEBULL_ACCESS_TOKEN:}
    # Explicit account ID to trade against. Leave blank to auto-pick the MARGIN
    # equity account from GET /trading/accounts/list (INDIVIDUAL_MARGIN). Set an
    # override here (or via WEBULL_ACCOUNT_ID env var) only if you need a specific
    # account and don't want auto-selection.
    account-id: ${WEBULL_ACCOUNT_ID:}
    # Log the full request/response to the Webull API (method, path, masked
    # headers, body). Emitted at DEBUG level — you must ALSO set the logging
    # level below to DEBUG for the lines to appear. Off by default.
    log-requests: false

  trading:
    # ── THE ONLY SWITCH between paper and live trading ────────────────────
    #   PAPER = Webull SANDBOX endpoint (api.sandbox.webull.com) — no real money
    #   LIVE  = PRODUCTION endpoint (api.webull.com) — REAL orders, real money
    # Orders are always submitted to the endpoint the mode selects.
    mode: LIVE
    ticker: AAPL                              # fallback when tickers.txt is absent
    watchlist-path: "classpath:tickers.txt"
    warmup-bars: 700
    ema-period: 600
    # ── Position sizing ──────────────────────────────────────────────────
    #   SHARES  = buy exactly order-quantity shares (if buying power covers it).
    #   PERCENT = buy floor(order-buying-power-pct * buyingPower / price) shares;
    #             order-quantity is ignored. Skips if it resolves to < 1 share or
    #             buying power is below risk.min-buying-power-usd.
    sizing-mode: "PERCENT"
    order-quantity: 5                 # used only when sizing-mode: SHARES
    order-buying-power-pct: 0.40      # used only when sizing-mode: PERCENT (40%)
    # EMA periods returned by the GET /api/ema/{ticker} endpoint
    ema-periods: [8, 20, 50, 100, 200, 600]
    # Trading sessions included in bar/market-data requests (comma-separated, multiple allowed):
    #   RTH = regular hours (09:30–16:00 ET), PRE = pre-market, ATH = after-hours, OVN = overnight
    # Endpoints accept a `sessions` query param to override this default per-request.
    trading-sessions: "RTH,PRE,ATH"
    # Max tickers processed in parallel per tick (guard sweep + candle dispatch).
    # Bounds concurrent Webull calls. 1 = sequential. Lowered to reduce 429s.
    ticker-concurrency: 3
    # Client-side cap on Webull bar-fetch requests/second (all threads) to avoid
    # 429 TOO_MANY_REQUESTS. Webull's Data API limit is 300/60s (=5/s), so keep
    # this BELOW 5 for headroom (retries, order + snapshot calls also count). 0 = unlimited.
    max-requests-per-second: 4
    # Max bid/ask spread as a FRACTION of the mid price (scales across price levels).
    # (ask-bid)/mid must be <= this or no trade is placed in any session (buy or exit).
    # 0.003 = 0.30% of price. Also blocks when bid/ask are unavailable. 0 = disable width check.
    max-spread-pct: 0.003


  # ── Strategy enable / disable ────────────────────────────────────────────
  strategies:
    ema600-enabled: false            # disabled — running the ST+cross strategy instead
    ema-crossover-enabled: false     # disabled — running the ST+cross strategy instead
    # "1m Supertrend + 20/50 Cross" strategy (standalone; BYPASSES the universal entry
    # guard). Entry on st-cross-timeframe: ST UP + fresh 20/50 cross + price above
    # 20/100/200 EMA + price within st-cross-ema600-band of the 600-EMA. Exit is the
    # ST_CROSS exit manager below (single 50-EMA trail). Set exit.manager: ST_CROSS.
    st-cross-enabled: true
    st-cross-timeframe: "M1"
    st-cross-ema-cross-fast: 20
    st-cross-ema-cross-slow: 50
    st-cross-ema600-band: 0.01       # price within 1% of the 600-EMA at entry (above or below)
    # Bar timeframe each strategy evaluates its ENTRY on (M1/M5/M15/M30/...).
    # Strategies are entry-only; exits are handled by the universal exit rule below.
    ema600-timeframe: "M1"
    ema-crossover-timeframe: "M1"
    # Volume filter (all strategy BUYs): only enter when average 1-min volume is
    # rising — over the last `volume-lookback` completed bars, the recent-half average
    # volume must exceed the older-half average (e.g. last 10 vs prior 10).
    volume-filter-enabled: false
    volume-lookback: 20
    # If a signal fires but volume isn't rising yet, hold it this many minutes and
    # re-check volume each bar; buy if it turns rising, else drop. 0 = no hold.
    volume-hold-minutes: 5
    # Cooldown: once a ticker is bought or exited, don't trade it again for this
    # many minutes (prevents immediate re-entry / churn). 0 = disabled.
    re-trade-cooldown-minutes: 10
    # 600-EMA entry = a bullish candle NEAR the 600-EMA (either side) closing above
    # it, on the latest completed bar. Captures a bounce OR an open-on-EMA momentum
    # candle, while rejecting bars floating far above the EMA (chasing highs).
    ema600-proximity-band: 0.005          # low must be within 0.5% of the EMA
    ema600-require-wick-rejection: false  # true = also require low < EMA
    ema600-body-min-ratio: 0.5            # body >= 50% of candle range (skip dojis)

  # ── Universal EXIT rule (all bot-opened positions; independent of entry) ──
  # Staged TRAILING stop — cut losers small, let winners run the trend. The stop
  # only ever ratchets UP; sell at market once price falls to/through it. Stages
  # (checked on the exit timeframe, latest COMPLETED bar):
  #   1. Hard stop      — entry * (1 - stop-loss-pct). Worst-case backstop.
  #   2. Breakeven      — at +breakeven-trigger-pct, move stop to entry + buffer.
  #   3. Structure trail— at +trail-arm-pct, trail the PREVIOUS candle's low,
  #                       ratcheting up as the trend prints higher lows.
  # Plus an EMA-bearish STATE exit (ema-fast below ema-slow) as a trend-failure catch.
  exit:
    enabled: true
    stop-loss-pct: 0.02        # -2% hard stop from entry (real, bounded backstop)
    ema-fast: 20
    ema-slow: 50
    timeframe: "M5"            # exit checks run on M5 (slower than entry; less noise)
    # Breakeven stop: once price is >= this % above entry, move the stop up to
    # entry + buffer (buffer = current bid/ask spread, min breakeven-min-buffer-usd)
    # so the trade can no longer turn into a loss.
    breakeven-trigger-pct: 0.01      # +1.0%
    breakeven-min-buffer-usd: 0.02
    # Structure trail: once price is >= this % above entry, trail the stop at the
    # previous completed candle's low (only moves up). Lets a winner run until the
    # trend breaks structure. Keep >= breakeven-trigger-pct.
    trail-arm-pct: 0.01              # +1.0%
    # ── Which exit manager is ACTIVE (exactly one runs) ──────────────────────
    #   STAGED   = the staged trailing stop above (hard stop + breakeven + M5 trail).
    #   ST_CROSS = a single 50-EMA trail for the "1m ST + 20/50 Cross" strategy:
    #              sell when price <= ema50 * (1 - ema50-trail-pct). Ratchets up only.
    #              No hard stop / breakeven — the pure 50-EMA ride.
    manager: "ST_CROSS"
    ema50-trail-timeframe: "M1"      # timeframe for the ST_CROSS 50-EMA
    ema50-trail-pct: 0.0005          # exit at ema50 - 0.05%

  # ── Diagnostics (local debugging only) ────────────────────────────────────
  diagnostics:
    # Exposes GET /api/diagnostics/credentials showing the loaded app key (full)
    # and app secret (MASKED + SHA-256 fingerprint). Off by default.
    # NEVER enable this in a shared or production environment.
    credentials-endpoint-enabled: true

  # ── Risk management ───────────────────────────────────────────────────────
  risk:
    # Halt trading for the rest of the day once losses exceed this % of
    # start-of-day equity.  0.10 = 10 %.
    max-daily-drawdown-pct: 0.30
    # Refuse new BUY orders when available buying power is below this amount ($).
    min-buying-power-usd: 100.0
    # Fetch a fresh account snapshot after every order.
    account-refresh-enabled: true
    # Daily drawdown halt. false = never auto-halt on drawdown (max-daily-drawdown-pct
    # is ignored while disabled). The $100 buying-power floor still applies.
    drawdown-halt-enabled: false

  # ── Supertrend indicator params (used app-wide via SupertrendService) ─────
  supertrend:
    length: 7
    factor: 3

  # ── Entry guard (applies to EVERY BUY across all strategies) ──────────────
  # Two legs, checked on the latest COMPLETED bar:
  #   1. Supertrend is UP on `supertrend-timespan` (uses webull.supertrend params)
  #   2. EMA stack on `ema-timespan`: EMA(fast) > EMA(slow), and (if ema-require-mid)
  #      also EMA(mid) > EMA(slow).
  # `condition-logic` combines the legs:
  #   AND (default) = both must pass — strict, fewest but highest-quality arms.
  #   OR            = arm once EITHER leg passes — looser, more arms. Under OR an
  #                   unavailable leg just counts as "not passed"; the other can arm.
  # Loosening levers (default = strict): drop the mid leg (ema-require-mid: false),
  # use a faster ST timeframe (supertrend-timespan: M15), or switch to OR.
  entry-guard:
    enabled: true
    ema-fast: 100
    ema-mid: 200
    ema-slow: 600
    ema-timespan: "M1"
    supertrend-timespan: "M15"      # M15 arms sooner / more often (more whipsaw). Webull has no M10.
    ema-require-mid: false           # false = only require EMA(fast) > EMA(slow)
    condition-logic: "OR"          # AND = both legs; OR = either leg arms

  # ── Market hours (America/New_York) ──────────────────────────────────────
  market-hours:
    core-open: "09:30"
    core-close: "16:00"
    # Extended hours ON so the pre-market (07:30–09:30) is a valid ENTRY window.
    # after-hours-close = 16:00 makes the after-hours window empty, so entries
    # run 07:30–16:00 ET (late pre-market + regular), stopping at 4 PM.
    extended-hours-enabled: true
    pre-market-open: "04:00"
    after-hours-close: "16:00"

  # ── Webull v3 endpoint paths ─────────────────────────────────────────────
  # Override any path here if Webull changes a route — no recompile needed.
  endpoints:
    account-list: "/trading/accounts/list"
    account-balance: "/trading/assets/balances/get"
    positions: "/trading/assets/positions/list"
    place-order: "/trading/orders/place"
    order-history: "/trading/orders/historical-orders/list"
    open-orders: "/trading/orders/open-orders/list"
    bars: "/market-data/stocks/bars/list"
    snapshot: "/market-data/stocks/snapshots/list"
